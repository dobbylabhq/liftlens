<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <!-- Add to Home Screen: open in a standalone window (no Safari address bar / toolbar) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LiftLens" />
    <!-- black: opaque status bar, page starts below it; the top bar reserves no safe-area for the notch, so black-translucent won't work -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>LiftLens · 动作实验室</title>
    <script>
      // Entry/preload script failed to load (got HTML mid-deploy, or a bad cached copy): refetch bypassing cache, then reload — at most once
      addEventListener(
        'error',
        function (e) {
          var t = e.target
          var src = t && (t.src || t.href)
          if (!src || src.indexOf('/assets/') < 0 || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
          try {
            if (sessionStorage.getItem('ll-entry-retry')) return
            sessionStorage.setItem('ll-entry-retry', '1')
          } catch (_) {}
          fetch(src, { cache: 'reload' }).catch(function () {}).then(function () { location.reload() })
        },
        true,
      )
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
